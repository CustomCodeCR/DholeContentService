name: content-service-ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOMCODE_NUGET_TOKEN: ${{ secrets.CUSTOMCODE_NUGET_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${CUSTOMCODE_NUGET_TOKEN:-$GITHUB_TOKEN}"
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore DholeContentService.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build DholeContentService.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Dhole.Content.UnitTests/Dhole.Content.UnitTests.csproj -c Release --no-build
