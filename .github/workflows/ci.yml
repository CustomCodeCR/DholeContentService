name: content-service-ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Configure GitHub Packages
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore
        run: dotnet restore DholeContentService.slnx
      - name: Build
        run: dotnet build DholeContentService.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Dhole.Content.UnitTests/Dhole.Content.UnitTests.csproj -c Release --no-build
