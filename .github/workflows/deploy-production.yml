name: Deploy Dhole Content - Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: content-api-production
  cancel-in-progress: false

env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.production" >> "$GITHUB_ENV"
      - name: Verify production server
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Content.Api/Dockerfile -t dhole/content-api:latest -t "dhole/content-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Content.Workers/Dockerfile -t dhole/content-workers:latest -t "dhole/content-workers:$SHA_TAG" .
      - name: Deploy Content
        run: |
          set -euo pipefail
          CONTENT_API_SERVICE="content-api"
          CONTENT_WORKERS_SERVICE="content-workers"
          echo "CONTENT_API_SERVICE=$CONTENT_API_SERVICE" >> "$GITHUB_ENV"
          echo "CONTENT_WORKERS_SERVICE=$CONTENT_WORKERS_SERVICE" >> "$GITHUB_ENV"
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config --services | grep -qx "$CONTENT_API_SERVICE"
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never "$CONTENT_API_SERVICE" "$CONTENT_WORKERS_SERVICE" "$CONTENT_WORKERS_SERVICE"
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps "$CONTENT_API_SERVICE"
      - name: Verify Content API health
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q "$CONTENT_API_SERVICE")"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || true)" != "true" ]; then docker logs --tail 200 "$CONTAINER_ID" || true; exit 1; fi
            CONTENT_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")"
            if [ -n "$CONTENT_IP" ] && curl -fsS --max-time 2 "http://${CONTENT_IP}:8080/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 200 "$CONTAINER_ID" || true
          exit 1
      - name: Keep only master and develop branches
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do case "$branch" in master|develop) continue ;; esac; git push origin --delete "$branch"; done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' || true)
      - name: Cleanup old images
        if: always()
        run: docker image prune -f
